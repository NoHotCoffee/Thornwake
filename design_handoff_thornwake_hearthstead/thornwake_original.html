<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thornwake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10130d;
    --bg-deep:#0a0c08;
    --panel:#1b2116;
    --panel-alt:#242b1c;
    --line:#343e29;
    --gold:#c9a227;
    --gold-bright:#eccb52;
    --blood:#9c3f3f;
    --blood-bright:#c85c5c;
    --parchment:#e9e1cb;
    --muted:#96a186;
    --steel:#6f95a4;
    --leaf:#6f9451;
    --purple:#8a72b0;
    --safe-t:env(safe-area-inset-top);
    --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-deep);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-touch-callout:none;
  }
  #app{
    max-width:480px; margin:0 auto; height:100dvh;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse 140% 60% at 50% -10%, #23301c 0%, var(--bg) 55%),
      var(--bg);
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.6);
  }
  h1,h2,h3{font-family:'Cinzel',serif; margin:0; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---- Top status bar ---- */
  #statusbar{
    padding:calc(10px + var(--safe-t)) 14px 10px;
    background:linear-gradient(180deg,#171d10,#141a0d);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  #statustop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  #playername{font-family:'Cinzel',serif; font-weight:700; font-size:15px; color:var(--gold-bright); letter-spacing:0.03em;}
  #cblevel{font-size:11px; color:var(--muted); margin-top:1px;}
  #goldstat{display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--gold-bright); font-size:14px;}
  .bar-row{display:flex; align-items:center; gap:7px; margin-top:5px;}
  .bar-label{font-size:10px; width:26px; color:var(--muted); font-weight:600; letter-spacing:0.04em;}
  .bar-track{flex:1; height:9px; background:#0d100a; border-radius:5px; overflow:hidden; border:1px solid #000; position:relative;}
  .bar-fill{height:100%; border-radius:5px; transition:width .35s ease;}
  .bar-fill.hp{background:linear-gradient(90deg,#7a2727,var(--blood-bright));}
  .bar-fill.xp{background:linear-gradient(90deg,#8a6f14,var(--gold-bright));}
  .bar-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8.5px; font-family:'JetBrains Mono',monospace; color:#fff; text-shadow:0 1px 1px #000; letter-spacing:0.02em;}

  /* ---- Activity bar (persists across tabs) ---- */
  #activitybar{
    display:none; background:#171d10; border-bottom:1px solid var(--line);
    padding:8px 14px; flex-shrink:0;
  }
  .activity-row{display:flex; align-items:center; gap:9px; margin-bottom:6px;}
  .activity-row:last-child{margin-bottom:0;}
  .activity-icon{font-size:15px; width:18px; text-align:center; flex-shrink:0;}
  .activity-label{font-size:11px; font-weight:600; color:var(--parchment); flex-shrink:0; white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis;}
  .activity-track{flex:1; height:6px; background:#0d100a; border-radius:4px; overflow:hidden; border:1px solid #000;}
  .activity-fill{height:100%; width:0%; background:linear-gradient(90deg,#5c7a3a,var(--leaf));}
  .activity-fill.fish{background:linear-gradient(90deg,#3d6270,var(--steel));}
  .activity-fill.mine{background:linear-gradient(90deg,#8a6f2a,var(--gold));}
  .activity-fill.cook{background:linear-gradient(90deg,#8a3f27,#c96a3a);}
  .activity-fill.smith{background:linear-gradient(90deg,#6a4a8a,var(--purple));}
  .activity-stop{
    flex-shrink:0; background:none; border:1px solid var(--line); color:var(--muted);
    font-size:9px; font-weight:700; padding:3px 8px; border-radius:10px; letter-spacing:0.03em;
  }

  /* ---- Main content ---- */
  #content{flex:1; overflow-y:auto; padding:14px 14px 90px; -webkit-overflow-scrolling:touch;}
  .screen{display:none; animation:fadein .25s ease;}
  .screen.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted);
    margin:18px 0 8px; display:flex; align-items:center; gap:8px;
  }
  .section-title:first-child{margin-top:0;}
  .section-title::after{content:''; flex:1; height:1px; background:var(--line);}

  .card{
    background:linear-gradient(180deg,var(--panel-alt),var(--panel));
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px;
    margin-bottom:10px;
    position:relative;
  }
  .card-row{display:flex; align-items:center; gap:12px;}
  .card-icon{
    width:46px; height:46px; border-radius:10px; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #2c3521, #171b10);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .card-info{flex:1; min-width:0;}
  .card-title{font-weight:700; font-size:14.5px; color:var(--parchment);}
  .card-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .card-locked{opacity:0.45;}
  .btn{
    border:none; border-radius:9px; padding:10px 14px; font-family:'Inter',sans-serif;
    font-weight:700; font-size:13px; letter-spacing:0.01em; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .08s ease, filter .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.95); filter:brightness(0.9);}
  .btn:disabled{opacity:0.35; filter:grayscale(0.4); pointer-events:none;}
  .btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#241c04;}
  .btn-blood{background:linear-gradient(180deg,var(--blood-bright),var(--blood)); color:#2a0d0d;}
  .btn-ghost{background:var(--panel-alt); color:var(--parchment); border:1px solid var(--line);}
  .btn-leaf{background:linear-gradient(180deg,#8fbf6a,var(--leaf)); color:#132008;}
  .btn-purple{background:linear-gradient(180deg,#b39cd6,var(--purple)); color:#1c1128;}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 10px; font-size:11.5px; border-radius:7px;}

  .progress-wrap{margin-top:9px;}
  .progress-track{height:7px; background:#0d100a; border-radius:5px; overflow:hidden; border:1px solid #000;}
  .progress-fill{height:100%; background:linear-gradient(90deg,#5c7a3a,var(--leaf)); width:0%;}
  .progress-fill.fish{background:linear-gradient(90deg,#3d6270,var(--steel));}
  .progress-fill.mine{background:linear-gradient(90deg,#8a6f2a,var(--gold));}
  .progress-fill.cook{background:linear-gradient(90deg,#8a3f27,#c96a3a);}
  .progress-fill.smith{background:linear-gradient(90deg,#6a4a8a,var(--purple));}

  /* skill ring */
  .ring-wrap{position:relative; width:46px; height:46px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:#0d100a; stroke-width:4;}
  .ring-fg{fill:none; stroke:var(--gold-bright); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .4s ease;}
  .ring-icon{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .ring-lvl{position:absolute; bottom:-4px; right:-4px; background:var(--gold); color:#241c04; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:9px; padding:1px 4px; border-radius:6px; border:1.5px solid var(--bg);}

  /* ---- Location picker (shop buy/sell subtabs still use these) ---- */
  .subtabs{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px;}
  .subtab{flex-shrink:0; padding:7px 13px; border-radius:20px; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap;}
  .subtab.active{background:var(--gold); color:#241c04; border-color:var(--gold);}
  .location-banner{
    background:linear-gradient(180deg, var(--panel-alt), var(--panel));
    border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;
  }
  .location-banner .lb-title{font-family:'Cinzel',serif; font-weight:700; font-size:16px; color:var(--gold-bright); display:flex; align-items:center; gap:8px;}
  .location-banner .lb-desc{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.55;}
  .location-banner .lb-hint{font-size:11px; color:var(--muted); margin-top:8px; font-family:'JetBrains Mono',monospace; display:flex; align-items:center; gap:5px;}
  .lb-travel-btn{margin-top:11px;}

  /* ---- Map ---- */
  .map-wrap{
    background:linear-gradient(180deg, var(--panel-alt), var(--panel));
    border:1px solid var(--line); border-radius:14px; padding:6px;
    margin-bottom:12px; overflow:hidden;
  }
  .map-wrap svg{display:block; width:100%; height:auto;}
  .map-pin{cursor:pointer;}
  .map-pin-label{font-family:'Inter',sans-serif; font-size:8.5px; font-weight:700; fill:var(--parchment); text-anchor:middle; letter-spacing:0.01em;}
  .map-pin.locked .map-pin-label{fill:var(--muted);}
  .map-pin-sub{font-family:'JetBrains Mono',monospace; font-size:6.5px; fill:var(--muted); text-anchor:middle;}
  .map-path{stroke:var(--line); stroke-width:1.6; fill:none;}
  .map-path.unlocked{stroke:#5a6a45; stroke-dasharray:none;}
  .map-path.locked{stroke:#2a2f22; stroke-dasharray:3 4;}
  .map-pulse{
    fill:none; stroke:var(--gold-bright); stroke-width:2;
    transform-origin:center; transform-box:fill-box;
    animation:mappulse 1.8s ease-out infinite;
  }
  @keyframes mappulse{
    0%{ r:15; opacity:0.75; }
    100%{ r:27; opacity:0; }
  }
  .map-current-dot{fill:var(--gold-bright); stroke:#0d100a; stroke-width:1;}

  /* ---- Combat screen ---- */
  .vs-wrap{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 14px;}
  .fighter{flex:1; text-align:center;}
  .fighter-portrait{
    width:72px; height:72px; border-radius:14px; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center; font-size:34px;
    background:radial-gradient(circle at 35% 30%, #2c3521, #171b10);
    border:2px solid var(--line);
  }
  .fighter.enemy .fighter-portrait{background:radial-gradient(circle at 35% 30%, #3a2020, #1a0f0f); border-color:#4a2626;}
  .fighter-name{font-weight:700; font-size:13px;}
  .vs-mark{font-family:'Cinzel',serif; color:var(--blood-bright); font-weight:900; font-size:13px;}
  .combat-log{
    background:var(--bg-deep); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; font-size:11.5px; color:var(--muted); height:70px; overflow-y:auto;
    font-family:'JetBrains Mono',monospace; line-height:1.6; margin-bottom:12px;
  }
  .combat-log div:last-child{color:var(--parchment);}
  .floater{
    position:absolute; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;
    pointer-events:none; animation:floatup 1s ease-out forwards; z-index:50;
  }
  @keyframes floatup{ 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-38px);} }

  /* ---- Quests ---- */
  .quest-badge{font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; padding:2px 7px; border-radius:6px; letter-spacing:0.03em; text-transform:uppercase;}
  .quest-badge.available{background:#2a3a1e; color:var(--leaf); border:1px solid var(--leaf);}
  .quest-badge.active{background:#3a2f14; color:var(--gold-bright); border:1px solid var(--gold);}
  .quest-badge.complete{background:#22301f; color:#8fbf6a; border:1px solid #4a6b34;}
  .quest-badge.locked{background:#241f1f; color:var(--muted); border:1px solid var(--line);}
  .quest-desc{font-size:12px; color:var(--muted); line-height:1.55; margin:7px 0 9px;}
  .quest-obj{font-size:11.5px; font-family:'JetBrains Mono',monospace; color:var(--parchment); margin-bottom:9px;}
  .quest-reward{font-size:10.5px; color:var(--muted); margin-bottom:9px;}

  /* ---- Bottom nav ---- */
  #nav{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; background:linear-gradient(0deg,#141a0d,#171d10);
    border-top:1px solid var(--line);
    padding:8px 2px calc(8px + var(--safe-b));
  }
  .navbtn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-family:'Inter',sans-serif; font-size:8.8px; font-weight:600; padding:5px 0;
    letter-spacing:0.01em; border-radius:8px; position:relative;
  }
  .navbtn .navicon{font-size:17px; filter:grayscale(0.6) brightness(0.8);}
  .navbtn.active{color:var(--gold-bright);}
  .navbtn.active .navicon{filter:none;}
  .navbtn .navdot{position:absolute; top:2px; right:22%; width:7px; height:7px; border-radius:50%; background:var(--leaf); border:1.5px solid #141a0d; display:none;}
  .navbtn .navdot.show{display:block;}
  .navbtn .navdot.quest{background:var(--gold-bright);}

  /* toast */
  #toastwrap{position:absolute; top:calc(var(--safe-t) + 6px); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:100; pointer-events:none;}
  .toast{
    background:#181f10ee; border:1px solid var(--gold); color:var(--gold-bright);
    font-family:'Cinzel',serif; font-weight:700; font-size:12.5px; padding:8px 16px; border-radius:20px;
    box-shadow:0 4px 14px rgba(0,0,0,0.5); animation:toastin .3s ease, toastout .3s ease 1.7s forwards;
    max-width:88%; text-align:center;
  }
  @keyframes toastin{from{opacity:0; transform:translateY(-10px) scale(0.9);} to{opacity:1; transform:translateY(0) scale(1);}}
  @keyframes toastout{from{opacity:1;} to{opacity:0; transform:translateY(-6px);}}

  .empty-hint{text-align:center; color:var(--muted); font-size:12px; padding:22px 10px; font-style:italic;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:10px; padding:2px 6px; border-radius:5px; background:var(--panel-alt); border:1px solid var(--line); color:var(--muted);}
  .gold-inline{color:var(--gold-bright); font-family:'JetBrains Mono',monospace; font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <div id="toastwrap"></div>

  <div id="statusbar">
    <div id="statustop">
      <div>
        <div id="playername">Thornwake</div>
        <div id="cblevel">Combat Level 1</div>
      </div>
      <div id="goldstat"><span>&#129689;</span><span id="goldval">0</span></div>
    </div>
    <div class="bar-row">
      <div class="bar-label">HP</div>
      <div class="bar-track"><div class="bar-fill hp" id="hpfill" style="width:100%"></div><div class="bar-text" id="hptext">20/20</div></div>
    </div>
  </div>

  <div id="activitybar"></div>

  <div id="content">

    <!-- TOWN -->
    <div class="screen active" id="screen-town">
      <div class="section-title">The Hollow of Thornwake</div>
      <div class="card">
        <p style="margin:0 0 10px; font-size:13px; color:var(--muted); line-height:1.6;">A moss-worn waystation at the edge of the deep woods. Rest here between ventures &mdash; your wounds mend fully whenever you return.</p>
        <button class="btn btn-leaf btn-block" onclick="restAtTown()">Rest &amp; Heal</button>
      </div>
      <div class="section-title">Your Skills</div>
      <div id="townskills"></div>
    </div>

    <!-- TRAVEL (locations gate what's available) -->
    <div class="screen" id="screen-travel">
      <div class="section-title">The Map of Thornwake</div>
      <div class="map-wrap" id="travelmap"></div>
      <div id="travelbanner"></div>

      <div id="travel-gather-wrap" style="display:none;">
        <div id="travelgathercontent"></div>
      </div>

      <div id="travel-smith-wrap" style="display:none;">
        <div id="travelsmithcontent"></div>
      </div>

      <div id="travel-combat-wrap" style="display:none;">
        <div id="combat-select">
          <div id="monsterlist"></div>
        </div>
        <div id="combat-fight" style="display:none;">
          <div class="vs-wrap">
            <div class="fighter" id="fighter-player">
              <div class="fighter-portrait">&#128100;</div>
              <div class="fighter-name">You</div>
              <div class="bar-track" style="margin-top:6px;"><div class="bar-fill hp" id="fhpfill-p"></div></div>
            </div>
            <div class="vs-mark">VS</div>
            <div class="fighter enemy" id="fighter-enemy">
              <div class="fighter-portrait" id="enemy-portrait">&#128123;</div>
              <div class="fighter-name" id="enemy-name">&mdash;</div>
              <div class="bar-track" style="margin-top:6px;"><div class="bar-fill hp" id="fhpfill-e"></div></div>
            </div>
          </div>
          <div class="combat-log" id="combatlog"></div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-blood" style="flex:2;" id="attackbtn" onclick="playerAttack()">Attack</button>
            <button class="btn btn-ghost" style="flex:1;" onclick="eatDuringCombat()">Eat</button>
            <button class="btn btn-ghost" style="flex:1;" onclick="fleeCombat()">Flee</button>
          </div>
        </div>
      </div>
    </div>

    <!-- COOK -->
    <div class="screen" id="screen-cook">
      <div class="section-title">The Hearth</div>
      <div id="cookcontent"></div>
    </div>

    <!-- SHOP -->
    <div class="screen" id="screen-shop">
      <div class="subtabs">
        <div class="subtab active" data-shoptab="buy" onclick="setShopTab('buy')">Buy Gear</div>
        <div class="subtab" data-shoptab="sell" onclick="setShopTab('sell')">Sell Goods</div>
      </div>
      <div id="shopcontent"></div>
    </div>

    <!-- QUESTS -->
    <div class="screen" id="screen-quests">
      <div class="section-title">Quest Log</div>
      <div id="questcontent"></div>
    </div>

    <!-- INVENTORY -->
    <div class="screen" id="screen-inv">
      <div class="section-title">Satchel</div>
      <div id="invcontent"></div>
      <div class="section-title">Equipped</div>
      <div id="equipcontent"></div>
    </div>

  </div>

  <div id="nav">
    <button class="navbtn active" data-screen="town" onclick="setScreen('town')"><span class="navicon">&#127960;</span>Town</button>
    <button class="navbtn" data-screen="travel" onclick="setScreen('travel')"><span class="navdot" id="traveldot"></span><span class="navicon">&#127755;</span>Travel</button>
    <button class="navbtn" data-screen="cook" onclick="setScreen('cook')"><span class="navdot" id="cookdot"></span><span class="navicon">&#128293;</span>Cook</button>
    <button class="navbtn" data-screen="shop" onclick="setScreen('shop')"><span class="navicon">&#127974;</span>Shop</button>
    <button class="navbtn" data-screen="quests" onclick="setScreen('quests')"><span class="navdot quest" id="questdot"></span><span class="navicon">&#128220;</span>Quests</button>
    <button class="navbtn" data-screen="inv" onclick="setScreen('inv')"><span class="navicon">&#127890;</span>Bag</button>
  </div>
</div>

<script>
/* ============================ DATA ============================ */
const XP_K = 45, XP_P = 1.85;
function xpForLevel(lvl){ return Math.floor(XP_K * Math.pow(lvl, XP_P)); }
const LEVEL_TOTALS = [0];
for(let l=1; l<=99; l++){ LEVEL_TOTALS.push(LEVEL_TOTALS[l-1] + xpForLevel(l)); }
function levelFromTotalXp(xp){
  let lvl = 1;
  for(let l=1; l<=99; l++){ if(xp >= LEVEL_TOTALS[l]) lvl = l+1; else break; }
  return Math.min(lvl, 99);
}
function xpProgress(xp){
  const lvl = levelFromTotalXp(xp);
  if(lvl >= 99) return {lvl, pct:100, cur:0, need:0};
  const base = LEVEL_TOTALS[lvl-1], next = LEVEL_TOTALS[lvl];
  return {lvl, pct: Math.floor(((xp-base)/(next-base))*100), cur: xp-base, need: next-base};
}

const RESOURCE_ITEMS = {
  birchLog:{name:'Birch Log', icon:'&#129736;'}, oakLog:{name:'Oak Log', icon:'&#129736;'},
  willowLog:{name:'Willow Log', icon:'&#129736;'}, yewLog:{name:'Yew Log', icon:'&#129736;'},
  ashwoodLog:{name:'Ashwood Log', icon:'&#129736;'}, elderwoodLog:{name:'Elderwood Log', icon:'&#129736;'},
  copperOre:{name:'Copper Ore', icon:'&#129704;'}, ironOre:{name:'Iron Ore', icon:'&#129704;'},
  silverOre:{name:'Silver Ore', icon:'&#129704;'}, goldOre:{name:'Gold Ore', icon:'&#129704;'},
  mythrilOre:{name:'Mythril Ore', icon:'&#129704;'}, adamantOre:{name:'Adamant Ore', icon:'&#129704;'},
  minnow:{name:'Minnow', icon:'&#128031;'}, trout:{name:'Trout', icon:'&#128031;'},
  bass:{name:'Bass', icon:'&#128031;'}, sturgeon:{name:'Sturgeon', icon:'&#128031;'},
  eel:{name:'Eel', icon:'&#128031;'}, leviathan:{name:'Leviathan Carp', icon:'&#128031;'},

  };
}
function maxHp(){ const lvl = xpProgress(state.combatXp).lvl; return 20 + lvl*4; }
function atkStat(){
  const lvl = xpProgress(state.combatXp).lvl;
  const w = WEAPONS.find(w=>w.id===state.equipment.weapon);
  return lvl + (w?w.atk:0);
}
function defStat(){
  const lvl = xpProgress(state.combatXp).lvl;
  const a = ARMORS.find(a=>a.id===state.equipment.armor);
  return Math.floor(lvl/2) + (a?a.def:0);
}
function invCount(id){ return state.inventory[id] || 0; }
function addItem(id, n){ state.inventory[id] = (state.inventory[id]||0) + n; }
function isUnlocked(id){ return state.unlockedLocations.includes(id); }

/* ============================ SAVE / LOAD ============================ */
const SAVE_KEY = 'thornwake-save';
let storageMode = 'unknown'; // 'claude' | 'local' | 'memory'
let memoryStore = {};

async function storageSet(key, value){
  if(storageMode === 'claude'){ await window.storage.set(key, value, false); return; }
  if(storageMode === 'local'){ localStorage.setItem(key, value); return; }
  memoryStore[key] = value;
}
async function storageGet(key){
  if(storageMode === 'claude'){
    try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
    catch(e){ return null; }
  }
  if(storageMode === 'local'){ return localStorage.getItem(key); }
  return memoryStore[key] || null;
}
async function detectStorageMode(){
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set('__thornwake_probe', '1', false); storageMode = 'claude'; return; }
    catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem('__thornwake_probe','1'); localStorage.removeItem('__thornwake_probe'); storageMode = 'local'; return; }
  catch(e){ /* fall through */ }
  storageMode = 'memory';
}

let saveTimer = null;
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 900); }
async function doSave(){
  try{ await storageSet(SAVE_KEY, JSON.stringify(state)); }
  catch(e){
    console.error('save failed', e);
    if(storageMode !== 'memory'){ storageMode = 'memory'; showToast('Saving to device failed - progress will last this session only'); }
  }
}
async function loadGame(){
  await detectStorageMode();
  try{
    const raw = await storageGet(SAVE_KEY);
    if(raw){
      const loaded = JSON.parse(raw);
      state = Object.assign(defaultState(), loaded);
      state.skills = Object.assign({woodcutting:0,mining:0,fishing:0,cooking:0,smithing:0}, loaded.skills||{});
      state.equipment = Object.assign({weapon:null,armor:null}, loaded.equipment||{});
      state.inventory = loaded.inventory || {};
      state.location = loaded.location || null;
      state.killCounts = loaded.killCounts || {};
      state.completedQuests = loaded.completedQuests || [];
      state.questState = loaded.questState || {};
      const merged = new Set([...(loaded.unlockedLocations||['birchwood','quarry','silverbrook','deepwoods']), ...ALWAYS_UNLOCKED]);
      state.unlockedLocations = Array.from(merged);
    } else {
      state = defaultState();
    }
  }catch(e){
    state = defaultState();
  }
  state.hp = Math.min(state.hp, maxHp());
  if(storageMode === 'memory'){ setTimeout(()=>showToast('Progress will only last this session'), 600); }
}

/* ============================ UI HELPERS ============================ */
function showToast(msg){
  const wrap = document.getElementById('toastwrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 2000);
}
function floatText(container, text, color){
  const f = document.createElement('div');
  f.className = 'floater';
  f.style.color = color || 'var(--gold-bright)';
  f.style.left = (40 + Math.random()*30) + '%';
  f.style.top = '30%';
  f.textContent = text;
  container.style.position = 'relative';
  container.appendChild(f);
  setTimeout(()=>f.remove(), 1000);
}
function ringSvg(pct, icon, lvl){
  const r = 19, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<div class="ring-wrap">
    <svg width="46" height="46" viewBox="0 0 46 46">
      <circle class="ring-bg" cx="23" cy="23" r="${r}"></circle>
      <circle class="ring-fg" cx="23" cy="23" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
    </svg>
    <div class="ring-icon">${icon}</div>
    <div class="ring-lvl">${lvl}</div>
  </div>`;
}
function grantXp(skillKey, amount, label){
  const before = xpProgress(state.skills[skillKey]).lvl;
  state.skills[skillKey] += amount;
  const after = xpProgress(state.skills[skillKey]).lvl;
  if(after > before) showToast(`${label} level up! Now level ${after}`);
}
function grantCombatXp(amount){
  const before = xpProgress(state.combatXp).lvl;
  state.combatXp += amount;
  const after = xpProgress(state.combatXp).lvl;
  if(after > before) showToast(`Combat level up! Now level ${after}`);
}

/* ============================ RENDER: TRAVEL / MAP ============================ */
/* Fixed positions on a 400x280 map. Town anchors the bottom; the four
   original locations ring it; expansion locations trail northward
   following the quest chain, with the two endgame zones at the far edges. */
const MAP_COORDS = {
  town:            {x:200, y:255},
  birchwood:       {x:95,  y:215},
  quarry:          {x:305, y:215},
  silverbrook:     {x:55,  y:255},
  deepwoods:       {x:345, y:250},
  millersbridge:   {x:200, y:190},
  emberforge:      {x:200, y:132},
  frostpine:       {x:40,  y:150},
  cinderdepths:    {x:360, y:150},
  stormcoast:      {x:35,  y:75},
  widowsvigil:     {x:128, y:95},
  oldwatchtower:   {x:272, y:95},
  sunkencrypt:     {x:200, y:48},
  frostholdruins:  {x:85,  y:20},
  ashenwastes:     {x:315, y:20},
};
const MAP_PATHS = [
  ['town','birchwood'], ['town','quarry'], ['town','silverbrook'], ['town','deepwoods'],
  ['birchwood','frostpine'], ['quarry','cinderdepths'], ['silverbrook','stormcoast'],
  ['town','millersbridge'], ['millersbridge','emberforge'],
  ['emberforge','widowsvigil'], ['emberforge','oldwatchtower'],
  ['widowsvigil','sunkencrypt'], ['oldwatchtower','sunkencrypt'],
  ['sunkencrypt','frostholdruins'], ['sunkencrypt','ashenwastes'],
];
let previewLocked = null; // location id tapped while still locked, for teaser only

function renderMap(){
  const wrap = document.getElementById('travelmap');
  const activeId = previewLocked || state.location;

  const paths = MAP_PATHS.map(([a,b])=>{
    const pa = MAP_COORDS[a], pb = MAP_COORDS[b];
    const bothOpen = (a==='town'||isUnlocked(a)) && (b==='town'||isUnlocked(b));
    return `<path class="map-path ${bothOpen?'unlocked':'locked'}" d="M${pa.x},${pa.y} L${pb.x},${pb.y}"></path>`;
  }).join('');

  const pins = Object.entries(MAP_COORDS).map(([id,pt])=>{
    if(id === 'town'){
      return `<g class="map-pin" onclick="setScreen('town')">
        <circle cx="${pt.x}" cy="${pt.y}" r="15" fill="url(#pinTown)" stroke="var(--gold-bright)" stroke-width="1.6"></circle>
        <text x="${pt.x}" y="${pt.y+5}" font-size="14" text-anchor="middle">&#127960;</text>
        <text class="map-pin-label" x="${pt.x}" y="${pt.y+27}">Thornwake</text>
      </g>`;
    }
    const loc = LOCATIONS[id];
    const unlocked = isUnlocked(id);
    const isActive = id === activeId;
    let ring = '';
    if(isActive && unlocked){
      ring = `<circle class="map-pulse" cx="${pt.x}" cy="${pt.y}" r="15"></circle>`;
    }
    const currentDot = (id === state.location) ? `<circle class="map-current-dot" cx="${pt.x}" cy="${pt.y-20}" r="2.6"></circle>` : '';
    return `<g class="map-pin ${unlocked?'':'locked'}" onclick="selectMapPin('${id}')">
      ${ring}
      <circle cx="${pt.x}" cy="${pt.y}" r="14" fill="${unlocked?'url(#pinOpen)':'url(#pinLocked)'}" stroke="${unlocked?(isActive?'var(--gold-bright)':'var(--line)'):'var(--line)'}" stroke-width="${isActive&&unlocked?2:1.2}"></circle>
      <text x="${pt.x}" y="${pt.y+4}" font-size="13" text-anchor="middle" opacity="${unlocked?1:0.4}">${unlocked?loc.icon:'&#128274;'}</text>
      ${currentDot}
      <text class="map-pin-label" x="${pt.x}" y="${pt.y+26}">${loc.name}</text>
    </g>`;
  }).join('');

  wrap.innerHTML = `<svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="mapbg" cx="50%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#26301c"></stop>
        <stop offset="100%" stop-color="#171c10"></stop>
      </radialGradient>
      <radialGradient id="pinOpen" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#2c3521"></stop><stop offset="100%" stop-color="#14180d"></stop>
      </radialGradient>
      <radialGradient id="pinLocked" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#1c1f16"></stop><stop offset="100%" stop-color="#101209"></stop>
      </radialGradient>
      <radialGradient id="pinTown" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#4a3a12"></stop><stop offset="100%" stop-color="#221a08"></stop>
      </radialGradient>
      <filter id="mapblur"><feGaussianBlur stdDeviation="14"></feGaussianBlur></filter>
    </defs>
    <rect x="0" y="0" width="400" height="280" fill="url(#mapbg)"></rect>
    <ellipse cx="90" cy="190" rx="90" ry="55" fill="#2c3d1e" opacity="0.5" filter="url(#mapblur)"></ellipse>
    <ellipse cx="320" cy="190" rx="90" ry="55" fill="#3a3320" opacity="0.5" filter="url(#mapblur)"></ellipse>
    <ellipse cx="45" cy="90" rx="70" ry="55" fill="#254050" opacity="0.45" filter="url(#mapblur)"></ellipse>
    <ellipse cx="200" cy="90" rx="110" ry="90" fill="#3a2438" opacity="0.4" filter="url(#mapblur)"></ellipse>
    ${paths}
    ${pins}
  </svg>`;
}

function selectMapPin(id){
  if(isUnlocked(id)){
    previewLocked = null;
    travelTo(id);
  } else {
    previewLocked = id;
    renderTravel();
  }
}
function travelTo(id){
  if(state.location !== id){
    if(gatherAction && gatherAction.locationId !== id) stopGather(false);
    if(smithAction && smithAction.locationId !== id) stopSmelt(false);
    state.location = id;
    queueSave();
  }
  renderTravel();
}
function renderTravel(){
  renderMap();
  const banner = document.getElementById('travelbanner');
  const gatherWrap = document.getElementById('travel-gather-wrap');
  const combatWrap = document.getElementById('travel-combat-wrap');
  const smithWrap = document.getElementById('travel-smith-wrap');

  if(previewLocked){
    const loc = LOCATIONS[previewLocked];
    const q = QUESTS.find(q=> (q.reward.unlock||[]).includes(previewLocked));
    const hint = q ? `Discovered by completing &ldquo;${q.name}&rdquo;` : 'Not yet discovered';
    banner.innerHTML = `<div class="location-banner"><div class="lb-title">&#128274; ${loc.name}</div><div class="lb-desc">You haven't found a way in yet.</div><div class="lb-hint">&#128220; ${hint}</div></div>`;
    gatherWrap.style.display = 'none'; combatWrap.style.display = 'none'; smithWrap.style.display = 'none';
    return;
  }

  if(!state.location || !isUnlocked(state.location)){
    banner.innerHTML = `<div class="location-banner"><div class="lb-title">Choose a destination</div><div class="lb-desc">Tap a place on the map to travel there. Only the resources and dangers found in that location will be available to you.</div></div>`;
    gatherWrap.style.display = 'none'; combatWrap.style.display = 'none'; smithWrap.style.display = 'none';
    return;
  }
  const loc = LOCATIONS[state.location];
  banner.innerHTML = `<div class="location-banner"><div class="lb-title">${loc.icon} ${loc.name}</div><div class="lb-desc">${loc.desc}</div></div>`;

  gatherWrap.style.display = loc.type==='gather' ? '' : 'none';
  combatWrap.style.display = loc.type==='combat' ? '' : 'none';
  smithWrap.style.display = loc.type==='smith' ? '' : 'none';

  if(loc.type === 'gather'){
    renderTravelGather();
  } else if(loc.type === 'smith'){
    renderTravelSmith();
  } else {
    if(fight){
      document.getElementById('combat-select').style.display = 'none';
      document.getElementById('combat-fight').style.display = '';
    } else {
      document.getElementById('combat-select').style.display = '';
      document.getElementById('combat-fight').style.display = 'none';
      renderMonsterList();
    }
  }
}
function renderTravelGather(){
  const loc = LOCATIONS[state.location];
  const skillKey = loc.skill;
  const p = xpProgress(state.skills[skillKey]);
  const wrap = document.getElementById('travelgathercontent');
  let html = `<div class="card-sub" style="margin-bottom:10px;">${SKILL_LABELS[skillKey]} Level ${p.lvl} &middot; <span class="mono">${p.lvl>=99?'MAX':p.cur+'/'+p.need+' xp'}</span></div>`;
  loc.nodes.forEach(node=>{
    const locked = p.lvl < node.reqLevel;
    const isActive = gatherAction && gatherAction.node.id === node.id && gatherAction.locationId===state.location;
    html += `<div class="card ${locked?'card-locked':''}">
      <div class="card-row">
        <div class="card-icon">${RESOURCE_ITEMS[node.item].icon}</div>
        <div class="card-info">
          <div class="card-title">${node.name}</div>
          <div class="card-sub">${locked? 'Requires level '+node.reqLevel : `+${node.xp} xp &middot; yields ${RESOURCE_ITEMS[node.item].name}`}</div>
        </div>
        ${locked? '' : `<button class="btn ${isActive?'btn-blood':'btn-leaf'} btn-sm" onclick="${isActive?'stopGather(true)':`startGather('${node.id}')`}">${isActive?'Stop':'Start'}</button>`}
      </div>
      ${isActive? `<div class="progress-wrap"><div class="progress-track"><div class="progress-fill ${loc.cls}" id="gatherprogress"></div></div></div>` : ''}
    </div>`;
  });
  wrap.innerHTML = html;
}

/* ============================ GATHER (background-persistent) ============================ */
let gatherAction = null; // {node, skillKey, locationId, startedAt}
let gatherRAF = null;
function startGather(nodeId){
  if(gatherAction) stopGather(false);
  const loc = LOCATIONS[state.location];
  const node = loc.nodes.find(n=>n.id===nodeId);
  gatherAction = { node, skillKey: loc.skill, locationId: state.location, startedAt: performance.now() };
  if(currentScreen==='travel') renderTravelGather();
  renderStatus();
  tickGather();
}
function stopGather(rerender){
  gatherAction = null;
  if(gatherRAF) cancelAnimationFrame(gatherRAF);
  renderActivityBar();
  renderStatus();
  if(rerender && currentScreen==='travel') renderTravelGather();
}
function tickGather(){
  if(!gatherAction) return;
  const { node } = gatherAction;
  const elapsed = performance.now() - gatherAction.startedAt;
  if(currentScreen==='travel'){
    const bar = document.getElementById('gatherprogress');
    if(bar) bar.style.width = Math.min(100,(elapsed/node.time)*100)+'%';
  }
  renderActivityBar();
  if(elapsed >= node.time){
    addItem(node.item, 1);
    grantXp(gatherAction.skillKey, node.xp, SKILL_LABELS[gatherAction.skillKey]);
    queueSave();
    gatherAction.startedAt = performance.now();
    if(currentScreen==='town') renderTown();
    if(currentScreen==='inv') renderInventory();
    if(currentScreen==='shop') renderShop();
    if(currentScreen==='quests') renderQuests();
  }
  gatherRAF = requestAnimationFrame(tickGather);
}

let cookAction = null;
function renderCook(){

  const wrap = document.getElementById('cookcontent');
  let html = `<div class="card-sub" style="margin-bottom:10px;">Cooking Level ${p.lvl} &middot; <span class="mono">${p.lvl>=99?'MAX':p.cur+'/'+p.need+' xp'}</span></div>`;
  COOK_RECIPES.forEach(r=>{

let cookRAF = null;

}
function stopCook(rerender){
  cookAction = null;
  if(cookRAF) cancelAnimationFrame(cookRAF);
  renderActivityBar();
  renderStatus();
  if(rerender && currentScreen==='cook') renderCook();
}
function tickCook(){
  if(!cookAction) return;
  const elapsed = performance.now() - cookAction.startedAt;
  if(currentScreen==='cook'){
    const bar = document.getElementById('cookprogress');
    if(bar) bar.style.width = Math.min(100,(elapsed/cookAction.time)*100)+'%';
  }

    if(invCount(cookAction.raw) < 1){ stopCook(true); return; }

/* ============================ RENDER: SMITHING (background-persistent) ============================ */
let smithAction = null;
function renderTravelSmith(){
  const p = xpProgress(state.skills.smithing);
  const wrap = document.getElementById('travelsmithcontent');
  let html = `<div class="card-sub" style="margin-bottom:10px;">Smithing Level ${p.lvl} &middot; <span class="mono">${p.lvl>=99?'MAX':p.cur+'/'+p.need+' xp'}</span></div>`;
  html += `<div class="section-title">Smelt Ore</div>`;
  SMELT_RECIPES.forEach(r=>{
    const locked = p.lvl < r.reqLevel;
    const have = invCount(r.ore);
    const isActive = smithAction && smithAction.id === r.id;
    html += `<div class="card ${locked?'card-locked':''}">
      <div class="card-row">
        <div class="card-icon">${RESOURCE_ITEMS[r.ore].icon}</div>
        <div class="card-info">
          <div class="card-title">${r.name}</div>
          <div class="card-sub">${locked?'Requires level '+r.reqLevel : `+${r.xp} xp &middot; have ${have} ore`}</div>
        </div>
        ${locked?'':`<button class="btn ${isActive?'btn-blood':'btn-purple'} btn-sm" ${(!isActive && have<1)?'disabled':''} onclick="${isActive?'stopSmelt(true)':`startSmelt('${r.id}')`}">${isActive?'Stop':'Smelt'}</button>`}
      </div>
      ${isActive? `<div class="progress-wrap"><div class="progress-track"><div class="progress-fill smith" id="smithprogress"></div></div></div>` : ''}
    </div>`;
  });
  html += `<div class="section-title">Forge Gear</div>`;
  const forgeable = [...WEAPONS.map(w=>({...w, slot:'weapon'})), ...ARMORS.map(a=>({...a, slot:'armor'}))].filter(i=>i.forgeOnly);
  forgeable.forEach(item=>{
    const locked = p.lvl < item.reqLevel;
    const owned = state.equipment[item.slot] === item.id;
    const barText = Object.entries(item.bars).map(([bid,qty])=>`${qty} ${RESOURCE_ITEMS[bid].name}${qty>1?'s':''}`).join(', ');
    const canAfford = !locked && state.gold >= item.cost && Object.entries(item.bars).every(([bid,qty])=>invCount(bid)>=qty);
    const stat = item.slot==='weapon' ? `+${item.atk} Attack` : `+${item.def} Defence`;
    html += `<div class="card ${locked?'card-locked':''}">
      <div class="card-row">
        <div class="card-icon">${item.slot==='weapon'?'&#9876;':'&#128737;'}</div>
        <div class="card-info">
          <div class="card-title">${item.name} ${owned?'<span class="tag">Equipped</span>':''}</div>
          <div class="card-sub">${locked?'Requires smithing level '+item.reqLevel : `${stat} &middot; needs ${barText} &middot; <span class="gold-inline">${item.cost}&#129689;</span>`}</div>
        </div>
        ${locked||owned?'':`<button class="btn btn-purple btn-sm" ${canAfford?'':'disabled'} onclick="forgeItem('${item.id}','${item.slot}')">Forge</button>`}

function startSmelt(id){
  if(smithAction) stopSmelt(false);
  const r = SMELT_RECIPES.find(r=>r.id===id);
  if(invCount(r.ore) < 1) return;
  smithAction = { ...r, locationId: state.location, startedAt: performance.now() };
  if(currentScreen==='travel') renderTravelSmith();
  renderStatus();
  tickSmelt();
}
let smithRAF = null;
function stopSmelt(rerender){
  smithAction = null;
  if(smithRAF) cancelAnimationFrame(smithRAF);
  renderActivityBar();
  renderStatus();
  if(rerender && currentScreen==='travel') renderTravelSmith();
}
function tickSmelt(){
  if(!smithAction) return;
  const elapsed = performance.now() - smithAction.startedAt;
  if(currentScreen==='travel'){
    const bar = document.getElementById('smithprogress');
    if(bar) bar.style.width = Math.min(100,(elapsed/smithAction.time)*100)+'%';
  }
  renderActivityBar();
  if(elapsed >= smithAction.time){
    if(invCount(smithAction.ore) < 1){ stopSmelt(true); return; }
    state.inventory[smithAction.ore]--;
    addItem(smithAction.bar, 1);
    grantXp('smithing', smithAction.xp, 'Smithing');
    queueSave();
    if(invCount(smithAction.ore) < 1){ stopSmelt(true); return; }
    smithAction.startedAt = performance.now();
    if(currentScreen==='town') renderTown();
    if(currentScreen==='inv') renderInventory();
    if(currentScreen==='quests') renderQuests();
  }
  smithRAF = requestAnimationFrame(tickSmelt);
}
function forgeItem(id, slot){
  const list = slot==='weapon'?WEAPONS:ARMORS;
  const item = list.find(i=>i.id===id);
  const smithLvl = xpProgress(state.skills.smithing).lvl;
  if(smithLvl < item.reqLevel) return;
  if(state.gold < item.cost) return;
  for(const [bid,qty] of Object.entries(item.bars)){ if(invCount(bid) < qty) return; }
  for(const [bid,qty] of Object.entries(item.bars)){ state.inventory[bid] -= qty; }
  state.gold -= item.cost;
  state.equipment[slot] = id;
  if(item.forgeXp) grantXp('smithing', item.forgeXp, 'Smithing');
  showToast(`Forged and equipped ${item.name}`);
  queueSave();
  renderAll();
}

/* ============================ RENDER: SHOP ============================ */
let shopTab = 'buy';
function setShopTab(t){ shopTab = t; document.querySelectorAll('[data-shoptab]').forEach(b=>b.classList.toggle('active', b.dataset.shoptab===t)); renderShop(); }
function renderShop(){
  const wrap = document.getElementById('shopcontent');
  const cb = xpProgress(state.combatXp).lvl;
  if(shopTab==='buy'){
    let html = '<div class="section-title">Weapons</div>';
    WEAPONS.filter(w=>!w.forgeOnly && !w.questOnly).forEach(w=>{
      const owned = state.equipment.weapon === w.id;
      const locked = cb < w.reqLevel;
      html += shopItemCard(w, 'weapon', owned, locked);
    });
    html += '<div class="section-title">Armor</div>';
    ARMORS.filter(a=>!a.forgeOnly && !a.questOnly).forEach(a=>{
      const owned = state.equipment.armor === a.id;
      const locked = cb < a.reqLevel;
      html += shopItemCard(a, 'armor', owned, locked);
    });
    wrap.innerHTML = html;
  } else {
    let html = '';
    const sellable = Object.entries(SELL_PRICES).filter(([id])=>invCount(id)>0);
    if(sellable.length===0){ html = '<div class="empty-hint">Nothing worth selling yet. Gather some resources first.</div>'; }
    sellable.forEach(([id,price])=>{
      html += `<div class="card card-row">
        <div class="card-icon">${RESOURCE_ITEMS[id].icon}</div>
        <div class="card-info">
          <div class="card-title">${RESOURCE_ITEMS[id].name}</div>
          <div class="card-sub">Own ${invCount(id)} &middot; <span class="gold-inline">${price}&#129689;</span> each</div>
        </div>
        <button class="btn btn-gold btn-sm" onclick="sellAll('${id}')">Sell All</button>
      </div>`;
    });
    wrap.innerHTML = html;
  }
}
function shopItemCard(item, slot, owned, locked){
  const stat = slot==='weapon' ? `+${item.atk} Attack` : `+${item.def} Defence`;
  const afford = state.gold >= item.cost;
  return `<div class="card ${locked?'card-locked':''}">
    <div class="card-row">
      <div class="card-icon">${slot==='weapon'?'&#9876;':'&#128737;'}</div>
      <div class="card-info">
        <div class="card-title">${item.name} ${owned?'<span class="tag">Equipped</span>':''}</div>
        <div class="card-sub">${locked? 'Requires combat level '+item.reqLevel : `${stat} &middot; <span class="gold-inline">${item.cost}&#129689;</span>`}</div>
      </div>
      ${locked||owned?'': `<button class="btn btn-gold btn-sm" ${afford?'':'disabled'} onclick="buyGear('${item.id}','${slot}')">Buy</button>`}
    </div>
  </div>`;
}
function buyGear(id, slot){
  const list = slot==='weapon'?WEAPONS:ARMORS;
  const item = list.find(i=>i.id===id);
  if(state.gold < item.cost) return;
  state.gold -= item.cost;
  state.equipment[slot] = id;
  showToast(`Equipped ${item.name}`);
  queueSave();
  renderAll();
}
function sellAll(id){
  const n = invCount(id);
  if(n<=0) return;
  state.gold += n * SELL_PRICES[id];
  state.inventory[id] = 0;
  queueSave();
  renderAll();
}

/* ============================ RENDER: INVENTORY ============================ */
function renderInventory(){
  const wrap = document.getElementById('invcontent');
  const items = Object.entries(state.inventory).filter(([,n])=>n>0);
  if(items.length===0){
    wrap.innerHTML = '<div class="empty-hint">Your satchel is empty. Go gather some resources.</div>';
  } else {
    wrap.innerHTML = items.map(([id,n])=>{
      const meta = RESOURCE_ITEMS[id];
      const isFood = meta.heal;
      return `<div class="card card-row">
        <div class="card-icon">${meta.icon}</div>
        <div class="card-info">
          <div class="card-title">${meta.name}</div>
          <div class="card-sub">Qty ${n}${isFood?' &middot; heals '+meta.heal+' hp':''}</div>
        </div>
        ${isFood?`<button class="btn btn-leaf btn-sm" onclick="eatItem('${id}')">Eat</button>`:''}
      </div>`;
    }).join('');
  }
  const eq = document.getElementById('equipcontent');
  const w = WEAPONS.find(w=>w.id===state.equipment.weapon);
  const a = ARMORS.find(a=>a.id===state.equipment.armor);
  eq.innerHTML = `
    <div class="card card-row">
      <div class="card-icon">&#9876;</div>
      <div class="card-info"><div class="card-title">Weapon</div><div class="card-sub">${w? w.name+' (+'+w.atk+' atk)' : 'None equipped'}</div></div>
    </div>
    <div class="card card-row">
      <div class="card-icon">&#128737;</div>
      <div class="card-info"><div class="card-title">Armor</div><div class="card-sub">${a? a.name+' (+'+a.def+' def)' : 'None equipped'}</div></div>
    </div>`;
}
function eatItem(id){
  if(invCount(id) < 1) return;
  const heal = RESOURCE_ITEMS[id].heal;
  state.inventory[id]--;
  state.hp = Math.min(maxHp(), state.hp + heal);
  showToast(`Ate ${RESOURCE_ITEMS[id].name} (+${heal} hp)`);
  queueSave();
  renderAll();
}

/* ============================ COMBAT ============================ */
let fight = null; // {monster, monsterHp, cooldown}
function renderMonsterList(){
  const loc = LOCATIONS[state.location];
  const cb = xpProgress(state.combatXp).lvl;
  const wrap = document.getElementById('monsterlist');
  const monsters = MONSTERS.filter(m=>loc.monsters.includes(m.id));
  wrap.innerHTML = monsters.map(m=>{
    const risky = cb < m.reqLevel - 3;
    return `<div class="card">
      <div class="card-row">
        <div class="card-icon">${m.icon}</div>
        <div class="card-info">
          <div class="card-title">${m.name}</div>
          <div class="card-sub">Suggested level ${m.reqLevel} &middot; ${m.maxHp} hp ${risky?'<span class="tag" style="color:var(--blood-bright); border-color:var(--blood);">Dangerous</span>':''}</div>
        </div>
        <button class="btn btn-blood btn-sm" onclick="engageMonster('${m.id}')">Fight</button>
      </div>
    </div>`;
  }).join('');
}
function engageMonster(id){
  if(state.hp <= 0){ showToast('Rest before fighting &mdash; return to Town'); return; }
  const m = MONSTERS.find(m=>m.id===id);
  fight = { monster: m, monsterHp: m.maxHp, cooldown:false };
  document.getElementById('combat-select').style.display = 'none';
  document.getElementById('combat-fight').style.display = '';
  document.getElementById('enemy-portrait').innerHTML = m.icon;
  document.getElementById('enemy-name').textContent = m.name;
  document.getElementById('combatlog').innerHTML = '';
  logCombat(`A ${m.name} blocks your path.`);
  renderFightBars();
}
function renderFightBars(){
  const mh = maxHp();
  document.getElementById('fhpfill-p').style.width = Math.max(0,state.hp/mh*100)+'%';
  document.getElementById('fhpfill-e').style.width = Math.max(0,fight.monsterHp/fight.monster.maxHp*100)+'%';
  document.getElementById('attackbtn').disabled = fight.cooldown;
}
function logCombat(text){
  const log = document.getElementById('combatlog');
  const d = document.createElement('div');
  d.textContent = text;
  log.appendChild(d);
  while(log.children.length > 6) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function playerAttack(){
  if(!fight || fight.cooldown) return;
  const atk = atkStat();
  const dmg = 1 + Math.floor(Math.random()*atk);
  fight.monsterHp -= dmg;
  logCombat(`You strike the ${fight.monster.name} for ${dmg}.`);
  floatText(document.getElementById('fighter-enemy'), '-'+dmg, 'var(--blood-bright)');
  renderFightBars();

  if(fight.monsterHp <= 0){
    winFight();
    return;
  }
  fight.cooldown = true;
  renderFightBars();
  setTimeout(()=>{
    if(!fight) return;
    const def = defStat();
    const raw = fight.monster.dmgMin + Math.floor(Math.random()*(fight.monster.dmgMax-fight.monster.dmgMin+1));
    const dmg2 = Math.max(1, raw - Math.floor(def/3));
    state.hp -= dmg2;
    logCombat(`The ${fight.monster.name} hits you for ${dmg2}.`);
    floatText(document.getElementById('fighter-player'), '-'+dmg2, 'var(--blood-bright)');
    fight.cooldown = false;
    renderStatus();
    renderFightBars();
    if(state.hp <= 0){ loseFight(); }
    queueSave();
  }, 550);
}
function winFight(){
  const m = fight.monster;
  const gold = m.goldMin + Math.floor(Math.random()*(m.goldMax-m.goldMin+1));
  state.gold += gold;
  grantCombatXp(m.xp);
  state.killCounts[m.id] = (state.killCounts[m.id]||0) + 1;
  logCombat(`You defeated the ${m.name}! +${m.xp} xp, +${gold} gold.`);
  showToast(`Victory! +${gold} gold`);
  queueSave();
  fight = null;
  setTimeout(()=>{ renderStatus(); renderTravel(); }, 900);
}
function loseFight(){
  const lost = Math.min(state.gold, Math.floor(state.gold*0.1));
  state.gold -= lost;
  state.hp = 1;
  logCombat(`You collapse and stagger back to town, dropping ${lost} gold.`);
  showToast('Defeated! Limped back to town');
  queueSave();
  fight = null;
  setTimeout(()=>{ setScreen('town'); }, 900);
}
function fleeCombat(){
  logCombat('You flee the battle.');
  fight = null;
  renderTravel();
}
function eatDuringCombat(){
  const foodId = Object.keys(RESOURCE_ITEMS).find(id=>RESOURCE_ITEMS[id].heal && invCount(id)>0);
  if(!foodId){ showToast('No food to eat'); return; }
  eatItem(foodId);
  if(fight) renderFightBars();
}

/* ============================ QUESTS ============================ */
function questStatus(q){
  if(state.completedQuests.includes(q.id)) return 'complete';
  const reqsMet = q.requires.every(r=>state.completedQuests.includes(r));
  if(!reqsMet) return 'locked';
  if(state.questState[q.id] && state.questState[q.id].status === 'active') return 'active';
  return 'available';
}
function questProgress(q){
  const obj = q.objective;
  if(obj.type === 'kill'){
    const qs = state.questState[q.id];
    const start = qs ? qs.startKill : (state.killCounts[obj.monster]||0);
    const current = Math.max(0, (state.killCounts[obj.monster]||0) - start);
    return { current: Math.min(current, obj.count), target: obj.count };
  }
  if(obj.type === 'deliver'){
    return { current: Math.min(invCount(obj.item), obj.count), target: obj.count };
  }
  return { current:0, target:1 };
}
function hasClaimableQuest(){
  return QUESTS.some(q=>{
    if(questStatus(q) !== 'active') return false;
    const p = questProgress(q);
    return p.current >= p.target;
  });
}
function acceptQuest(id){
  const q = QUESTS.find(q=>q.id===id);
  const startKill = q.objective.type==='kill' ? (state.killCounts[q.objective.monster]||0) : 0;
  state.questState[id] = { status:'active', startKill };
  showToast(`Quest accepted: ${q.name}`);
  queueSave();
  renderAll();
}
function turnInQuest(id){
  const q = QUESTS.find(q=>q.id===id);
  const p = questProgress(q);
  if(p.current < p.target) return;
  if(q.objective.type === 'deliver'){
    state.inventory[q.objective.item] = Math.max(0, invCount(q.objective.item) - q.objective.count);
  }
  const r = q.reward;
  if(r.gold) state.gold += r.gold;
  if(r.combatXp) grantCombatXp(r.combatXp);
  if(r.skillXp){ Object.entries(r.skillXp).forEach(([k,v])=>grantXp(k, v, SKILL_LABELS[k])); }
  if(r.unlock){ r.unlock.forEach(locId=>{ if(!state.unlockedLocations.includes(locId)) state.unlockedLocations.push(locId); }); }
  if(r.item){
    const w = WEAPONS.find(w=>w.id===r.item);
    if(w){ state.equipment.weapon = r.item; }
  }
  state.completedQuests.push(id);
  state.questState[id] = { status:'complete' };
  showToast(`Quest complete: ${q.name}`);
  if(r.text) setTimeout(()=>showToast(r.text), 900);
  queueSave();
  renderAll();
}
function renderQuests(){
  const wrap = document.getElementById('questcontent');
  wrap.innerHTML = QUESTS.map(q=>{
    const status = questStatus(q);
    const p = questProgress(q);
    let objText = '';
    if(q.objective.type==='kill') objText = `Defeat ${q.objective.count} ${MONSTERS.find(m=>m.id===q.objective.monster).name}${q.objective.count>1?'s':''} at ${q.objective.locName} &mdash; ${p.current}/${p.target}`;
    if(q.objective.type==='deliver') objText = `Deliver ${q.objective.count} ${RESOURCE_ITEMS[q.objective.item].name}${q.objective.count>1?'s':''} &mdash; ${p.current}/${p.target}`;
    let rewardText = [];
    if(q.reward.gold) rewardText.push(`${q.reward.gold} gold`);
    if(q.reward.combatXp) rewardText.push(`${q.reward.combatXp} combat xp`);
    if(q.reward.skillXp) Object.entries(q.reward.skillXp).forEach(([k,v])=>rewardText.push(`${v} ${SKILL_LABELS[k]} xp`));
    if(q.reward.item) rewardText.push(WEAPONS.find(w=>w.id===q.reward.item).name);
    if(q.reward.unlock) rewardText.push('new location' + (q.reward.unlock.length>1?'s':''));

    let actionBtn = '';
    if(status==='available') actionBtn = `<button class="btn btn-gold btn-sm btn-block" onclick="acceptQuest('${q.id}')">Accept Quest</button>`;
    if(status==='active'){
      const ready = p.current >= p.target;
      actionBtn = `<button class="btn ${ready?'btn-gold':'btn-ghost'} btn-sm btn-block" ${ready?'':'disabled'} onclick="turnInQuest('${q.id}')">${ready?'Turn In':'In Progress'}</button>`;
    }
    if(status==='complete') actionBtn = `<div class="empty-hint" style="padding:4px;">Completed</div>`;

    return `<div class="card ${status==='locked'?'card-locked':''}">
      <div class="card-row" style="align-items:flex-start; margin-bottom:2px;">
        <div class="card-info">
          <div class="card-title">${q.name} <span class="quest-badge ${status}">${status}</span></div>
        </div>
      </div>
      <div class="quest-desc">${q.desc}</div>
      ${status!=='locked' ? `<div class="quest-obj">${objText}</div>` : `<div class="quest-obj" style="color:var(--muted);">Requires: ${q.requires.map(r=>QUESTS.find(qq=>qq.id===r).name).join(', ')}</div>`}
      <div class="quest-reward">Reward: ${rewardText.join(', ')}</div>
      ${status!=='locked' ? actionBtn : ''}
    </div>`;
  }).join('');
}

/* ============================ RENDER ALL ============================ */
function renderAll(){
  renderStatus();
  renderActivityBar();
  if(currentScreen==='town') renderTown();
  if(currentScreen==='travel') renderTravel();
  if(currentScreen==='cook') renderCook();
  if(currentScreen==='shop') renderShop();
  if(currentScreen==='quests') renderQuests();
  if(currentScreen==='inv') renderInventory();
}

/* ============================ INIT ============================ */
(async function init(){
  await loadGame();
  renderAll();
})();
</script>
</body>
